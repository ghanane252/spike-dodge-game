<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> spike Dodge Game</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none; /* منع التمرير المزعج للشاشة أثناء اللعب بالهاتف */
        }

        body {
            margin: 0;
            padding: 0;
            background: #0b0b14;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #ffffff;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: #ff5555;
            text-shadow: 2px 2px #000000;
            letter-spacing: 2px;
        }

        #score-container {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            background: #1a1a2e;
            padding: 8px 20px;
            border: 4px solid #ffcc00;
            border-radius: 8px;
            box-shadow: 0 5px 0px #000000;
        }

        .score-box {
            font-size: 16px;
            font-weight: 900;
            color: #ffcc00;
            letter-spacing: 1px;
            text-shadow: 2px 2px #000;
        }

        canvas {
            background: #161625;
            border: 4px solid #ffffff;
            box-shadow: 6px 6px 0px #000000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            max-width: 100%;
            height: auto;
        }

        .portfolio-footer {
    margin-top: 12px;
    font-size: 13px;
    color: #a5a5c7;
    text-align: center;
    background: #141421;
    padding: 8px 16px;
    border: 2px dashed #444;
    border-radius: 6px;
    max-width: 380px;
    width: 100%;
}

.portfolio-footer a {
    color: #00ffcc;
    text-decoration: none;
    font-weight: bold;
    border-bottom: 2px dashed #00ffcc;
    padding-bottom: 1px;
    transition: 0.2s;
}

.portfolio-footer a:hover {
    color: #ffcc00;
    border-bottom-color: #ffcc00;
}


    </style>
</head>
<body>

    <div id="score-container">
        <div class="score-box">SCORE: <span id="score">0</span></div>
        <div class="score-box" style="color: #00ffcc;">HIGH: <span id="high-score">0</span></div>
    </div>
    
    <canvas id="gameCanvas" width="360" height="420"></canvas>
    
    <div class="portfolio-footer">
    Created by <a href="#" target="_blank">Hanane Guetiteche</a>
</div>

   
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("high-score");

        ctx.imageSmoothingEnabled = false;

        let highScore = localStorage.getItem("balloonHighScore") || 0;
        highScoreElement.innerText = highScore;

        let player = {
            x: canvas.width / 2 - 18,
            y: canvas.height - 55,
            width: 36,
            height: 44,
            speed: 6,
            dx: 0
        };

        let enemies = [];
        let score = 0;
        let enemyTimer = 0;
        let isGameOver = false;
        let animationFrameId = null;
        const balloonPixelArt = [
            "   PPPP   ",
            "  PPPPPP  ",
            " PPPPPPPP ",
            " PPPPPPPP ",
            " PPPPPPPP ",
            "  PPPPPP  ",
            "   PPPP   ",
            "    PP    ",
            "   SCCS   "
        ];

        const pinPixelArt = [
            "   RRRR   ",
            "  RRRRRR  ",
            "  RRWWPR  ",
            "  RRRRRR  ",
            "   RRRR   ",
            "    SS    ",
            "    SS    ",
            "    SS    "
        ];

        // دعم لوحة المفاتيح
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight") player.dx = player.speed;
            else if (e.key === "ArrowLeft") player.dx = -player.speed;
            
            if (isGameOver && e.code === "Space") {
                e.preventDefault();
                resetGame();
            }
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowRight" || e.key === "ArrowLeft") player.dx = 0;
        });

        // دعم التحكم عبر الماوس واللمس (الهواتف الذكية)
        function handleMove(clientX) {
            const rect = canvas.getBoundingClientRect();
            let x = clientX - rect.left;
            player.x = x - player.width / 2;
        }

        canvas.addEventListener("mousemove", (e) => {
            if (isGameOver) return;
            handleMove(e.clientX);
        });

        canvas.addEventListener("touchmove", (e) => {
            if (isGameOver) return;
            handleMove(e.touches[0].clientX);
            e.preventDefault();
        }, { passive: false });

        // إعادة التشغيل بالضغط على الشاشة في الهواتف عند الخسارة
        canvas.addEventListener("click", () => {
            if (isGameOver) resetGame();
        });

        canvas.addEventListener("touchstart", () => {
            if (isGameOver) resetGame();
        });

        function spawnEnemy() {
            const size = 30;
            const x = Math.random() * (canvas.width - size);
            
            let baseSpeed = Math.random() * 2 + 2;
            if (score >= 200) {
                baseSpeed += 2.5;
            }

            enemies.push({ x: x, y: -size, width: size, height: size, speed: baseSpeed });
        }

        function update() {
            if (isGameOver) return;

            player.x += player.dx;
            if (player.x < 0) {
                player.x = 0;
            } else if (player.x + player.width > canvas.width) {
                player.x = canvas.width - player.width;
            }

            enemyTimer++;
            let spawnInterval = score >= 200 ? 28 : 38;
            if (enemyTimer % spawnInterval === 0) {
                spawnEnemy();
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += enemies[i].speed;

                if (
                    player.x < enemies[i].x + enemies[i].width - 6 &&
                    player.x + player.width - 6 > enemies[i].x &&
                    player.y < enemies[i].y + enemies[i].height - 6 &&
                    player.y + player.height - 6 > enemies[i].y
                ) {
                    gameOver();
                }

                if (enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);
                    score += 10;
                    scoreElement.innerText = score;
                    
                    if (score > highScore) {
                        highScore = score;
                        highScoreElement.innerText = highScore;
                        localStorage.setItem("balloonHighScore", highScore);
                    }
                }
            }
        }

        function drawPixelMatrix(matrix, startX, startY, pixelSize, colorMap) {
            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[r].length; c++) {
                    let char = matrix[r][c];
                    if (colorMap[char]) {
                        ctx.fillStyle = colorMap[char];
                        ctx.fillRect(startX + c * pixelSize, startY + r * pixelSize, pixelSize, pixelSize);
                    }
                }
            }
        }

        const balloonColors = {
            'P': '#ff3366',
            'S': '#ffffff',
            'C': '#ffcc00'
        };

        const pinColors = {
            'R': '#ff3d00',
            'W': '#ffffff',
            'P': '#dd2c00',
            'S': '#90a4ae'
        };

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "rgba(255, 255, 255, 0.02)";
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 20) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 20) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            let pPixelSize = player.width / 10;
            drawPixelMatrix(balloonPixelArt, player.x, player.y, pPixelSize, balloonColors);

            enemies.forEach(enemy => {
                let ePixelSize = enemy.width / 8;
                drawPixelMatrix(pinPixelArt, enemy.x, enemy.y, ePixelSize, pinColors);
            });

            if (score >= 200 && !isGameOver) {
                ctx.fillStyle = "#ffcc00";
                ctx.font = "bold 11px 'Courier New'";
                ctx.textAlign = "right";
                ctx.fillText("⚡️ SPEED BOOST!", canvas.width - 10, 20);
            }

            if (isGameOver) {
                ctx.fillStyle = "rgba(11, 11, 20, 0.92)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ff5555";
                ctx.font = "bold 24px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30);
                
                ctx.fillStyle = "#00ffcc";
                ctx.font = "15px 'Courier New'";
                ctx.fillText("HIGH SCORE: " + highScore, canvas.width / 2, canvas.height / 2 + 5);

                ctx.fillStyle = "#ffcc00";
                ctx.font = "12px 'Courier New'";
                ctx.fillText("Tap or Space to Restart", canvas.width / 2, canvas.height / 2 + 45);
            }
        }

        function gameLoop() {
            update();
            draw();
            if (!isGameOver) {
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        function gameOver() {
            isGameOver = true;
            cancelAnimationFrame(animationFrameId);
            draw();
        }

        function resetGame() {
            isGameOver = false;
            score = 0;
            scoreElement.innerText = score;
            enemies = [];
            player.x = canvas.width / 2 - 18;
            player.dx = 0;
            enemyTimer = 0;
            cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        gameLoop();
    </script>
</body>
</html>
